rules:
  - id: go-wails-application-import-containment
    languages: [go]
    severity: ERROR
    message: >-
      github.com/wailsapp/wails/v3/pkg/application imported outside the desktop
      app. Domain logic belongs in libraries/ with no Wails import, so it stays
      testable as ordinary Go and the services in apps/desktop/services stay
      thin adapters over it. If a library needs to reach the UI, return a value
      or an error and let the service translate it.
      See .claude/skills/wails/SKILL.md.
    paths:
      # Globs resolve against the SCAN ROOT (`apps libraries`), so a leading
      # `apps/` would match nothing — see .semgrep/README.md.
      exclude:
        - "**/desktop/**"
    pattern-regex: '"github\.com/wailsapp/wails/v3/pkg/application"'
