# Go file watcher for `moon run desktop:dev`.
#
# Replaces the `refresh`-based watcher that `wails3 dev` used (which went away
# with the Taskfiles). scripts/wails-dev.sh exports DEV=true plus the
# FRONTEND_DEVSERVER_URL / WAILS_VITE_PORT pair before handing over to air, so
# the rebuilt binary proxies assets to vite instead of serving the embedded FS.
root = "."
tmp_dir = ".air"

[build]
# Regenerate bindings before rebuilding, matching what `wails3 dev` did on a Go
# change: a new or changed service method reaches the frontend without a manual
# step. `-clean` briefly empties frontend/bindings/, so vite may log one
# resolve error mid-rebuild before picking the new files up.
cmd = "go tool wails3 generate bindings -clean=true -ts -i && bash ../../scripts/wails-build.sh"
bin = "./bin/desktop"
include_ext = ["go"]
exclude_dir = ["bin", "build", "frontend", ".air"]
exclude_regex = ["_test\\.go$"]
# The window takes a moment to close; without a kill delay the next build can
# race the old process for the single-instance lock.
kill_delay = "5s"
send_interrupt = true
stop_on_error = true
delay = 500

[log]
main_only = true
